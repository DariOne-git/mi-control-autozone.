<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<meta name="description" content="Panel personal de pendientes, jornadas y procesos.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>MI CONTROL | AUTOZONE</title>
<style>
body{margin:0;background:#0d141b;color:#edf3f7;font:16px system-ui;display:grid;min-height:100vh;place-items:center}
.box{max-width:34rem;padding:2rem;text-align:center}
p{color:#9aabb9}
</style>
</head>
<body>
<main class="box"><h1>MI CONTROL | AUTOZONE</h1><p id="status">Preparando la aplicación…</p></main>
<script>
(async()=>{
 try{
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
  const response=await fetch("./app-data.b64",{cache:"no-store"});
  if(!response.ok)throw new Error("No se pudo descargar el archivo principal ("+response.status+")");
  const encoded=(await response.text()).trim();
  const binary=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  if(!html.includes("MI CONTROL | AUTOZONE")||html.length<40000)throw new Error("El archivo principal está incompleto");
  document.open();document.write(html);document.close();
 }catch(error){
  document.getElementById("status").textContent="Error al abrir MI CONTROL: "+(error&&error.message?error.message:String(error));
  console.error(error);
 }
})();
</script>
</body>
</html>
