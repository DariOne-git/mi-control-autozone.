(async()=>{try{
 const raw=atob(DATA),bytes=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 if(!("DecompressionStream" in window))throw Error("Este navegador no admite descompresión gzip");
 const ds=new DecompressionStream("gzip"),writer=ds.writable.getWriter(),reader=ds.readable.getReader(),parts=[];
 const pump=(async()=>{for(;;){const x=await reader.read();if(x.done)break;parts.push(x.value)}})();
 await writer.write(bytes);await writer.close();await pump;
 const size=parts.reduce((n,p)=>n+p.length,0),joined=new Uint8Array(size);let offset=0;
 for(const p of parts){joined.set(p,offset);offset+=p.length}
 const html=new TextDecoder("utf-8").decode(joined);
 if(!html.includes("MI CONTROL")||!html.includes("page-dashboard"))throw Error("El contenido de la aplicación está incompleto");
 document.open();document.write(html);document.close();
 }catch(e){document.getElementById("status").textContent="Error técnico: "+(e&&e.message?e.message:String(e));console.error(e)}})();
</script></body></html>
